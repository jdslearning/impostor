<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a0a4d" />
  <title>Editor de canciones · Impostor Musical</title>

  <link rel="icon" type="image/png" href="icon-1024.png" />
  <link rel="apple-touch-icon" href="icon-1024.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body class="editor-page">
  <main id="app">
    <section class="screen active" id="screen-editor">
      <header class="editor-header">
        <h1>🎵 Canciones</h1>
        <a href="index.html" class="back-link">← Volver</a>
      </header>

      <p class="editor-help">
        Una canción por línea, con el formato <strong>Título - Artista</strong>.
        Edita libremente y pulsa Guardar.
      </p>

      <p id="editor-status" class="editor-status">—</p>

      <textarea
        id="songs-text"
        class="songs-text"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        placeholder="Despacito - Luis Fonsi&#10;Macarena - Los del Río&#10;..."></textarea>

      <div class="editor-toolbar">
        <button id="btn-save" class="btn btn-primary">Guardar</button>
        <button id="btn-restore" class="btn btn-secondary">Restaurar lista por defecto</button>
      </div>
    </section>
  </main>

  <script src="editor.js?v=5"></script>
</body>
</html>
